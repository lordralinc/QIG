[tool.poetry]
name = "quote-image-generator"
version = "0.1.3"
description = "Create beautiful, customizable images with quotes, supporting unique font styles and emojis"
authors = ["lordralinc <lordralinc@gmail.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/lordralinc/QIG"
repository = "https://github.com/lordralinc/QIG"
keywords = [
    "quote",
    "quote-generator",
    "image-generator",
    "text-to-image",
    "PIL",
    "Pillow",
    "image-processing",
    "typography",
    "fonts",
    "emoji",
    "social-media",
    "content-creation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",

    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",

    "Typing :: Typed",
]

[tool.poetry.urls]
"Homepage" = "https://github.com/lordralinc/QIG"
"Repository" = "https://github.com/lordralinc/QIG"
"Documentation" = "https://github.com/lordralinc/QIG#readme"
"Bug Tracker" = "https://github.com/lordralinc/QIG/issues"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pillow = ">=12.1.1"

[tool.poetry.group.dev.dependencies]
black = "^23.3.0"
isort = "^5.12.0"
mypy = "^1.3.0"
ruff = ">=0.0.246"
pre-commit = "^4.0.0"
rich = "^13.9.4"
requests = "^2.32.3"
beautifulsoup4 = "^4.12.3"

[tool.ruff]
line-length = 120
respect-gitignore = true
target-version = "py310"
lint.select = [
    "UP",
    "I",
    "E",
    "W",
    "F",
    "B",
    "C4",
    "S",
    "BLE",
    "T20",
    "T10",
    "PT",
    "RUF",
    "DTZ",
    "ERA",
    "FURB",
    "ALL",
]
lint.ignore = [
    "ICN001",
    "ANN201",
    "ANN202",
    "ANN204",
    "C408",
    "D",
    "ANN401",
    "DTZ005",
    "DTZ006",
    "EM101",
    "EM102",
    "FBT",
    "G004",
    "RET503",
    "RUF001",
    "RUF002",
    "RUF003",
    "S110",
    "TRY003",
    "TRY301",
    "C901",
    "PLR0912",
    "PLR0913",
    "PGH003",
    "PLR0915",
    "TD002",
    "TD003",
    "FIX002",
    "UP037",
    "PLR2004",
    "COM812",
]
lint.fixable = ["I", "RUF022", "UP035"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
    "classmethod",
    "pydantic.field_validator",
    "pydantic.model_validator",
]


[tool.ruff.lint.flake8-type-checking]
exempt-modules = ["typing_extensions", "typing"]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
